<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="300" fill="rgba(255,255,255,0.03)"/>
  <circle cx="900" cy="500" r="400" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1100" cy="100" r="150" fill="rgba(255,255,255,0.04)"/>

  <!-- Decorative emojis -->
  <text x="80" y="100" font-size="60" opacity="0.15">🎪</text>
  <text x="1050" y="580" font-size="80" opacity="0.15">🎵</text>
  <text x="80" y="560" font-size="50" opacity="0.12">🎭</text>
  <text x="1050" y="120" font-size="55" opacity="0.12">📸</text>

  <!-- Logo icon -->
  <rect x="140" y="215" width="80" height="80" rx="20" fill="rgba(255,255,255,0.15)"/>
  <text x="180" y="272" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">JE</text>

  <!-- Main title -->
  <text x="260" y="280" font-family="Arial,sans-serif" font-size="64" font-weight="bold" fill="url(#text)">Jakarta Events</text>

  <!-- Subtitle -->
  <text x="260" y="345" font-family="Arial,sans-serif" font-size="28" fill="rgba(255,255,255,0.7)">
    🎪 Temukan &amp; Abadikan Setiap Momen
  </text>

  <!-- Bottom tagline bar -->
  <rect x="0" y="530" width="1200" height="100" fill="rgba(0,0,0,0.15)"/>
  <text x="600" y="590" font-family="Arial,sans-serif" font-size="24" fill="rgba(255,255,255,0.5)" text-anchor="middle">
    Portal event terbaik di Jakarta — Konser · Comedy · Theater · Festival
  </text>
</svg>
